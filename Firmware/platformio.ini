; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
; Bluepad32 só no fork maxgerhardt (stock espressif32@6.10.0 não inclui Bluepad32.h).
; Commit e010351 fixo — não usar main.zip flutuante.
platform = espressif32@6.10.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags =
    -I include
    -I src
    -D WS_MAX_QUEUED_MESSAGES=2
board_build.sdkconfig.defaults = sdkconfig.defaults
board_build.filesystem = littlefs
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/e010351b2cafe3a872f18878cb2d3e08f167c650.zip
lib_deps =
    esphome/ESPAsyncWebServer-esphome@^3.3.0
    esphome/AsyncTCP-esphome@^2.1.0